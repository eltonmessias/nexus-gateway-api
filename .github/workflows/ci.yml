name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` compiles every module, runs unit + integration tests
      # (Testcontainers works out of the box — Docker is available on the runner)
      # and packages the runnable gateway jar.
      - name: Build & test
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload gateway jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-gateway-jar
          path: nexus-gateway/target/nexus-gateway-*.jar
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Build & push image
    needs: build-test
    # Publish images only from the main line, never from PRs or dev
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
